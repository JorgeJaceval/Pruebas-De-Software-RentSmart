services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rentsmart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copia .env.example a .env antes de iniciar}
      POSTGRES_DB: ${POSTGRES_DB:-rentsmart}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-rentsmart}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Copia .env.example a .env antes de iniciar}
      DATABASE_NAME: ${POSTGRES_DB:-rentsmart}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?Genera AUTH_SECRET_KEY en .env según el README}
      AUTH_TOKEN_MINUTES: ${AUTH_TOKEN_MINUTES:-30}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=5)"]
      interval: 5s
      timeout: 6s
      start_period: 10s
      retries: 10
  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
