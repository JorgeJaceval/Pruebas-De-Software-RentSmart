name: Pruebas RentSmart

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      failure_probe:
        description: Validación controlada del bloqueo de CI (solo ejecución manual)
        type: choice
        default: none
        options: [none, frontend, backend]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # No interrumpimos una conexión SSH de despliegue al llegar otro push a main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Obtener código
        uses: actions/checkout@v7
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias congeladas
        run: npm ci
      - name: Comprobar tipos y compilar
        run: npm run build
      - name: Ejecutar Jest y guardar reporte
        run: |
          mkdir -p test-results
          npm run test:ci -- --json --outputFile=test-results/jest.json
      - name: Forzar fallo controlado de frontend
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.failure_probe == 'frontend' }}
        run: |
          echo '::error::Fallo controlado de CI; las pruebas de aplicación no han fallado.'
          exit 1
      - name: Conservar reporte de frontend
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-tests
          path: frontend/test-results/jest.json
          if-no-files-found: warn
          retention-days: 7
      - name: Conservar frontend compilado
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_PORT: 5432
      AUTH_SECRET_KEY: ci-only-rentsmart-authentication-key-for-tests
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rentsmart
          POSTGRES_PASSWORD: rentsmart_dev
          POSTGRES_DB: rentsmart
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U rentsmart -d rentsmart"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Obtener código
        uses: actions/checkout@v7
      - name: Preparar Python y uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.17"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Instalar dependencias congeladas
        run: uv sync --frozen
      - name: Aplicar migraciones
        run: uv run alembic upgrade head
      - name: Comprobar modelos y esquema
        run: uv run alembic check
      - name: Ejecutar Pytest y guardar reporte
        run: uv run pytest -q --junitxml=test-results/pytest.xml
      - name: Forzar fallo controlado de backend
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.failure_probe == 'backend' }}
        run: |
          echo '::error::Fallo controlado de CI; las pruebas de aplicación no han fallado.'
          exit 1
      - name: Conservar reporte de backend
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-tests
          path: backend/test-results/pytest.xml
          if-no-files-found: warn
          retention-days: 7

  quality:
    needs: [frontend, backend]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      BACKEND_RESULT: ${{ needs.backend.result }}
    steps:
      - name: Comprobar todos los resultados antes de liberar
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '## Resultado de CI\n\n'
            printf '| Trabajo | Resultado |\n| --- | --- |\n'
            printf '| frontend | %s |\n' "$FRONTEND_RESULT"
            printf '| backend | %s |\n' "$BACKEND_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$FRONTEND_RESULT" != 'success' || "$BACKEND_RESULT" != 'success' ]]; then
            echo '::error::CI bloqueada: frontend y backend deben terminar correctamente.'
            exit 1
          fi
          echo 'Build, pruebas y migraciones aprobados.'

  production:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener código
        uses: actions/checkout@v7
      - name: Validar scripts de despliegue
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          shellcheck scripts/*.sh
          python3 -m unittest discover -s scripts/tests -v
      - name: Comprobar contenedores de producción sin publicar al VPS
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: bash scripts/smoke-production.sh "$RELEASE_SHA"

  deploy:
    needs: [quality, production]
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    concurrency:
      group: rentsmart-production
      cancel-in-progress: false
    steps:
      - name: Obtener el commit aprobado
        uses: actions/checkout@v7
      - name: Desplegar por SSH y verificar versión pública
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: bash scripts/deploy-ssh.sh
      - name: Registrar publicación verificada
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          printf '## Despliegue verificado\n\nCommit: %s\n\nURL: %s\n' "$GITHUB_SHA" "$DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"
