name: Pruebas RentSmart

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cobertura-frontend
          path: frontend/coverage/
          if-no-files-found: error

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_PORT: 5432
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rentsmart
          POSTGRES_PASSWORD: rentsmart_dev
          POSTGRES_DB: rentsmart
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U rentsmart -d rentsmart"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.17"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest -q --cov=app --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=json:coverage.json --cov-report=html
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cobertura-backend
          path: |
            backend/coverage.xml
            backend/coverage.json
            backend/htmlcov/
          if-no-files-found: error
