name: Pruebas RentSmart

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:ci

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_PORT: 5432
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rentsmart
          POSTGRES_PASSWORD: rentsmart_dev
          POSTGRES_DB: rentsmart
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U rentsmart -d rentsmart"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          version: "0.11.17"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run pytest -q

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_PORT: 5432
    defaults:
      run:
        working-directory: frontend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rentsmart
          POSTGRES_PASSWORD: rentsmart_dev
          POSTGRES_DB: rentsmart
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U rentsmart -d rentsmart"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v9
        with:
          version: "0.11.17"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --directory ../backend
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
