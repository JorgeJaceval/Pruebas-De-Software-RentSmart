[project]
name = "rentsmart-backend"
version = "0.1.0"
description = "API de RentSmart con FastAPI, PostgreSQL y SQLModel"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlmodel>=0.0.22,<0.1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "pwdlib[argon2]>=0.3,<1",
    "email-validator>=2.2,<3",
    "alembic>=1.15,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "httpx>=0.28,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgres: requiere una instancia de PostgreSQL disponible"]
